name: Android build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [f-mobile-app]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests and debug APK
        run: ./gradlew clean :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

      # Uploaded unzipped, so the run page offers SMAssistant-<version>-debug.apk directly.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: android/app/build/outputs/apk/debug/SMAssistant-*-debug.apk
          archive: false
          if-no-files-found: error
