# SM Assistant default configuration, bundled with the app.
#
# Values saved on the settings screens override what is here.
# Keys are left empty on purpose: the user enters them in the app.
# Do not commit real API keys to this file.

apis:
  linkedin:
    api: https://api.linkedin.com/rest/posts
    key: ""

  gemini:
    api: https://generativelanguage.googleapis.com/v1beta
    model: gemini-2.5-flash
    image_model: gemini-2.5-flash-image
    # Model for the video slides. Empty: the image model above.
    video_model: ""
    key: ""

  groq:
    api: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.3-70b-versatile
    key: ""

  # Cloudflare Workers AI. {account_id} is filled in from the Account ID setting;
  # the key is an API token with Workers AI permission.
  cloudflare:
    api: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai
    account_id: ""
    model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    image_model: "@cf/black-forest-labs/flux-1-schnell"
    key: ""

  # Pollinations.AI (gen.pollinations.ai). The key is a secret sk_ key from enter.pollinations.ai.
  pollinations:
    api: https://gen.pollinations.ai/v1/chat/completions
    model: openai/gpt-4o-mini
    image_model: black-forest-labs/flux.1-schnell
    key: ""

# LinkedIn post length (docs/requirements/12-post-length.md).
# max_characters: LinkedIn's limit, including the default hashtags, spaces, emoji and line breaks.
# shorten_attempts: how many times the AI agent is asked to shorten a post that comes back too long.
# ai_hashtags: the most hashtags the AI agent adds when "AI-suggested hashtags" is on (1 to 10).
# default_hashtags: the Default Hash Tags list on a new install, with the toggle on, until the user saves their own.
linkedin_post:
  max_characters: 3000
  shorten_attempts: 3
  ai_hashtags: 3
  default_hashtags: "#JavaDeveloper #FullStackDeveloper #AIAssistedDeveloper #AIEngineer #OpenToWork"

# Checks before a generated image is finished (docs/design/image-video-pipeline.md).
# The app always checks the definition the text agent writes and that every picture is a real,
# non-blank image of the right size. With vision_review on, the text agent also looks at each
# finished infographic and scores it out of 10 (Gemini and vision models can; others skip it).
# min_score: the score an image needs (0 to 10).
# retries: how many times an image under min_score is written and drawn again (0 to 3); the best one is kept.
image_checks:
  vision_review: true
  min_score: 7
  retries: 1

# The longest prompt each image agent reads, in characters (0: no limit). Content longer than an agent's
# budget is never cut: the text agent splits it over a numbered poster series (1/N, 2/N...).
image_prompt_budgets:
  gemini: 0
  cloudflare: 2000
  pollinations: 1500

# Inputs for the image prompt templates (docs/design/image-templates.md).
# audience: who the images are for. brand_name: drawn small on each image when set.
# style_guide: colours, fonts and layout to keep, e.g. "navy and teal, rounded cards"; empty: a restrained professional style.
# series: true wraps every image in the Series template, so posts look like one series.
# format: auto (the app picks per image), portrait (2:3), square (1:1) or landscape (3:2).
# mode: auto (the image agent paints the poster; the app draws it instead when the review finds its text wrong),
#   drawn (the app draws the text), painted (the image agent paints the whole image) or both (two of each).
# layout: auto (one poster; content too dense for one poster becomes a numbered poster series, 1/N) or single (one image, smaller text). Images are never a carousel.
image_style:
  audience: "developers, senior engineers and architects"
  brand_name: ""
  style_guide: ""
  series: false
  format: auto
  mode: auto
  layout: auto

# Inputs for the video templates (docs/requirements/19), apart from the images' image_style.
# audience: who the videos are for. brand_name: drawn small on each slide when set.
# style_guide: colours and look to keep; empty: a restrained professional style.
video_style:
  audience: "developers, senior engineers and architects"
  brand_name: ""
  style_guide: ""
